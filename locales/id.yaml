explainer:
  no_reply_prefix: "⚠️ Tidak ada balasan: "
  empty_response: "{model} tidak menghasilkan balasan kali ini, bahkan setelah beberapa percobaan ulang. Kirim `continue` untuk mencoba lagi, atau ganti model dengan /model."
  exit:
    all_retries_exhausted_no_response: provider model tidak menjawab setelah semua percobaan ulang. Kirim /retry, atau ganti model dengan /model.
    partial_stream_recovery: streaming berhenti lebih awal dan hanya respons sebagian yang bisa dipulihkan. Kirim `continue` untuk melanjutkan dari tempat berhentinya.
    fallback_prior_turn_content: tidak ada konten baru yang dihasilkan di turn ini; menampilkan konteks sebelumnya yang bisa dipulihkan. Kirim `continue` untuk mencoba lagi.
    redirect_restart_limit_exceeded: request dibatalkan oleh koreksi baru di setiap percobaan, jadi turnnya dihentikan daripada mencoba selamanya. Koreksi terakhirmu sudah diantrekan sebagai pesan berikutnya.
    rebuilt_restart_limit_exceeded: setiap provider di rantai fallback terus gagal, jadi turnnya dihentikan daripada mencoba selamanya. Kirim `continue` atau ganti provider.
    budget_exhausted: anggaran iterasi/biaya per-turn habis sebelum jawaban akhir. Kirim `continue` untuk melanjutkan.
    ollama_runtime_context_too_small: context window model lokal terlalu kecil untuk menyelesaikannya. Naikkan ukuran konteksnya atau pakai model yang lebih besar.
    pending_tool_result: turnnya berhenti saat hasil tool masih pending dan model tidak menghasilkan teks lanjutan. Kirim `continue` agar dia merangkumnya.
    interrupted_during_api_call: request terputus di tengah panggilan sebelum balasannya diterima. Kirim `continue` untuk mencoba lagi.
    max_iterations_reached: batas iterasi tool maksimum tercapai sebelum jawaban akhir. Kirim `continue` untuk melanjutkan, atau naikkan `max_iterations`.
    error_near_max_iterations: terjadi error saat hampir mencapai batas iterasi sebelum jawaban akhir. Periksa output tool di atas, lalu kirim `continue`.
    repeated_outer_errors: turnnya terus gagal dengan error berulang dan dihentikan lebih awal daripada mencoba selamanya. Periksa error di atas, lalu kirim `continue` untuk mencoba lagi.
  persistence:
    compression: turnnya dihentikan karena proses lain sedang memadatkan sesi ini. Pesanmu seharusnya sudah tersimpan — kirim lagi setelah kompresi selesai.
    compression_closed: turnnya dihentikan karena sesi ini dirotasi oleh kompresi konteks dan kelanjutan hidupnya tidak bisa diadopsi. Penyimpanannya sendiri sehat — refresh klien (atau mulai turn baru) agar dia mengambil session id yang baru, lalu kirim lagi pesanmu.
    turn_lease: turnnya dihentikan karena proses Thor lain mengambil alih sesi ini. Balasanmu tidak tersimpan — tunggu proses lain selesai, lalu kirim lagi pesanmu.
    session_row_missing: sesi ini dihapus dari penyimpanan saat chatnya masih terbuka, dan Thor tidak bisa membuatnya ulang, jadi pesan ini tidak tersimpan. Kirim lagi pesanmu; kalau terus gagal, jalankan `thor {profile_arg}doctor`.
    locked: turnnya dihentikan karena penyimpanan sesi sedang sibuk (proses Thor lain sedang menulis ke database state). Pesanmu seharusnya sudah tersimpan — kirim lagi sebentar lagi.
    replaced: file database sesi diganti saat Thor sedang berjalan, jadi pesan ini tidak tersimpan (salinannya ada di {home}/sessions/). Hentikan Thor (`thor {profile_arg}gateway stop`), jalankan `thor {profile_arg}doctor` — bukan `thor {profile_arg}doctor --fix`, yang akan memperbaiki file yang salah di tempat — lalu mulai lagi dan kirim pesanmu sekali lagi. Langkah pemulihan lanjutan ada di log.
    deleted_wal: "proses Thor lain masih memegang salinan lama write-ahead log database sesi, jadi Thor berhenti menulis agar file-nya aman dan pesan ini tidak tersimpan (salinannya ada di {home}/sessions/). Tidak ada yang hilang. Tutup semua proses Thor di profil ini (aplikasi Desktop, `thor {profile_arg}gateway stop`, dashboard, cron), jalankan `thor {profile_arg}doctor` — dia akan menyebut proses mana yang masih memegang log — lalu mulai Thor lagi dan kirim pesanmu sekali lagi. Jangan jalankan `doctor --fix` atau menghapus file state.db apa pun selama mereka berjalan. Panduan: {recovery_docs}"
    corrupt: "turnnya dihentikan karena database state melaporkan korupsi struktural (transkripnya akan hilang saat restart). Mengosongkan disk tidak akan membantu. Opsi pemulihan:\n1. Jalankan `thor {profile_arg}doctor --fix`\n2. Hentikan gateway, lalu pulihkan dengan:\n   thor {profile_arg}sessions recover --source {db_path} --inspect-only\n   (kalau laporannya bisa dipulihkan) thor {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — pemulihan membuat snapshot file yang rusak dulu; JANGAN jalankan `sqlite3 ... \".recover\"` terhadap state.db yang hidup, sqlite3 CLI yang rentan bisa merusaknya lebih parah\n3. Pulihkan dari backup di {backups_dir}/\nLalu kirim lagi pesanmu."
    fts_index: "turnnya dihentikan karena indeks pencarian sesi (FTS5) korup dan tidak bisa dilepas, jadi pesan ini tidak tersimpan. Penyimpanan pesannya sendiri tidak rusak: jangan jalankan tool pemulihan atau memulihkan backup. Jalankan `thor {profile_arg}doctor --fix` (atau restart Thor, yang memperbaiki indeksnya saat dibuka), lalu kirim lagi pesanmu."
    disk: "Thor tidak bisa menyimpan percakapan ini ke disk, jadi dia berhenti daripada kehilangan pesanmu. Diskimu mungkin penuh: kosongkan sedikit ruang (atau perbaiki izin di {home}/state.db), lalu kirim lagi pesanmu."
    default: "Thor tidak bisa menyimpan percakapan ini, jadi dia berhenti daripada kehilangan pesanmu. Kemungkinan penyebabnya: drive kehabisan ruang, atau proses Thor lain sedang memegang database. Tutup jendela Thor lain, jalankan `thor {profile_arg}doctor` untuk memeriksa penyimpanan, lalu kirim lagi pesanmu."
  file_mutation:
    header: "⚠️ Verifier mutasi file: {count} edit file GAGAL di turn ini, terlepas dari kata-kata di atas yang mungkin terdengar sebaliknya. Jalankan `git status` atau `read_file` untuk memastikan apa yang sebenarnya masuk."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: gagal
  shared:
    and_more: "  • … dan {count} lagi"
    the_model: Modelnya
tips:
  t001: /bg <prompt> menjalankan tugas di sesi terpisah sementara sesi saat ini tetap bebas; /btw <pertanyaan> menjawab pertanyaan sampingan soal percakapan ini tanpa menghentikannya.
  t002: /branch mencabang sesi saat ini supaya kamu bisa menjelajah arah lain tanpa kehilangan progres.
  t003: /compress memadatkan konteks percakapan secara manual saat sudah terlalu panjang.
  t004: /rollback mendaftar checkpoint filesystem — pulihkan file yang diubah agent ke kondisi sebelumnya.
  t005: /rollback diff 2 menampilkan pratinjau apa yang berubah sejak checkpoint 2 tanpa memulihkan apa pun.
  t006: /rollback 2 src/file.py memulihkan satu file dari checkpoint tertentu.
  t007: /title "proyek saya" menamai sesimu — lanjutkan nanti dengan /resume atau thor -c.
  t008: /resume melanjutkan dari tempat kamu berhenti di sesi yang sudah dinamai sebelumnya.
  t009: /queue <prompt> mengantrekan pesan untuk turn berikutnya tanpa menghentikan turn yang sedang jalan.
  t010: /undo menghapus pertukaran user/assistant terakhir dari percakapan.
  t011: /retry mengirim ulang pesan terakhirmu — berguna saat respons agent kurang tepat.
  t012: "/verbose memutar tampilan progres tool: off → new → all → verbose."
  t013: /reasoning high menaikkan kedalaman berpikir model. /reasoning show menampilkan reasoning-nya.
  t014: /fast menyalakan priority processing untuk respons API yang lebih cepat (tergantung provider).
  t015: /yolo melewati semua prompt persetujuan perintah berbahaya sampai sesi ini berakhir.
  t016: /model memungkinkan ganti model di tengah sesi — coba /model sonnet atau /model gpt-5.
  t017: /model --global mengubah model default-mu secara permanen.
  t018: /personality pirate mengatur personality yang seru — 14 pilihan bawaan dari kawaii sampai shakespeare.
  t019: /skin mengganti tema CLI — coba ares, mono, slate, poseidon, atau charizard.
  t020: /statusbar menyalakan bar permanen yang menampilkan model, token, persentase isi konteks, biaya, dan durasi.
  t021: /tools disable browser menonaktifkan tool browser sementara untuk sesi ini.
  t022: /browser connect menyambungkan tool browser ke browser keluarga Chromium milikmu yang sedang berjalan lewat CDP.
  t023: /plugins mendaftar plugin yang terpasang beserta statusnya.
  t024: /cron mengelola tugas terjadwal — atur prompt berulang dengan pengiriman ke platform mana pun.
  t025: /reload-mcp memuat ulang konfigurasi MCP server secara panas tanpa restart.
  t026: /usage menampilkan pemakaian token, rincian biaya, dan durasi sesi.
  t027: /insights menampilkan analitik pemakaian 30 hari terakhir.
  t028: /paste memeriksa clipboard-mu untuk gambar dan melampirkannya ke pesan berikutnya.
  t029: /profile menampilkan profil mana yang aktif dan direktori home-nya.
  t030: /config menampilkan konfigurasimu saat ini secara ringkas.
  t031: /stop mematikan semua proses background yang dijalankan agent.
  t032: "@file:path/to/file.py menyuntikkan isi file langsung ke pesanmu."
  t033: "@file:main.py:10-50 hanya menyuntikkan baris 10-50 dari sebuah file."
  t034: "@folder:src/ menyuntikkan daftar pohon direktori."
  t035: "@diff menyuntikkan perubahan git yang belum di-stage ke pesanmu."
  t036: "@staged menyuntikkan perubahan git yang sudah di-stage (git diff --staged)."
  t037: "@git:5 menyuntikkan 5 commit terakhir dengan patch lengkapnya."
  t038: "@url:https://example.com mengambil dan menyuntikkan isi halaman web."
  t039: Mengetik @ memicu pelengkapan path filesystem — navigasi ke file mana pun secara interaktif.
  t040: "Gabungkan beberapa referensi: \"Review @file:main.py dan @file:test.py untuk konsistensi.\""
  t041: Alt+Enter menyisipkan baris baru untuk input multi-baris. (Windows Terminal menangkap Alt+Enter — pakai Ctrl+Enter.)
  t042: Ctrl+C menghentikan agent. Tekan dua kali dalam 2 detik untuk keluar paksa.
  t043: Ctrl+Z menangguhkan Thor ke background — jalankan fg di shell-mu untuk melanjutkan.
  t044: Tab menerima teks saran otomatis atau melengkapi slash command.
  t045: Ketik pesan baru saat agent bekerja untuk menghentikan dan mengarahkannya ulang.
  t046: Alt+V menempelkan gambar dari clipboard-mu ke percakapan.
  t047: Menempel 5+ baris otomatis disimpan ke file dan diganti referensi yang ringkas.
  t048: thor -c melanjutkan sesi CLI terakhirmu. thor -c "nama proyek" melanjutkan berdasarkan judulnya.
  t049: thor -w membuat git worktree yang terisolasi — cocok untuk alur kerja agent paralel.
  t050: "thor -w -q \"Perbaiki issue #42\" menggabungkan isolasi worktree dengan kueri sekali jalan."
  t051: thor chat -t web,terminal hanya mengaktifkan toolset tertentu untuk sesi yang fokus.
  t052: thor chat -s github-pr-workflow memuat skill di awal peluncuran.
  t053: thor chat -q "kueri" menjalankan satu kueri non-interaktif lalu keluar.
  t054: thor chat --max-turns 1000 menimpa batas default 500 iterasi per turn.
  t055: thor chat --checkpoints menyalakan snapshot filesystem sebelum setiap perubahan file yang destruktif.
  t056: thor --yolo melewati semua prompt persetujuan perintah berbahaya untuk seluruh sesi.
  t057: thor chat --source telegram menandai sesinya agar bisa difilter di thor sessions list.
  t058: thor -p work chat berjalan di bawah profil tertentu tanpa mengubah default-mu.
  t059: thor doctor --fix mendiagnosis dan memperbaiki otomatis masalah config dan dependensi.
  t060: thor dump menampilkan ringkasan setup yang ringkas — bagus untuk laporan bug.
  t061: thor config set KEY VALUE mengarahkan otomatis secret ke .env dan sisanya ke config.yaml.
  t062: thor config edit membuka config.yaml di editor default-mu.
  t063: thor config check memindai opsi konfigurasi yang hilang atau basi.
  t064: thor sessions browse membuka pemilih sesi interaktif dengan pencarian.
  t065: thor sessions stats menampilkan jumlah sesi per platform dan ukuran database.
  t066: thor sessions prune --older-than 30 membersihkan sesi lama.
  t067: thor skills search react --source skills-sh mencari di direktori publik skills.sh.
  t068: thor skills check memindai skill hub yang terpasang untuk pembaruan dari upstream.
  t069: thor skills tap add myorg/skills-repo menambahkan sumber skill GitHub kustom.
  t070: thor skills snapshot export setup.json mengekspor konfigurasi skill-mu untuk backup atau dibagikan.
  t071: thor mcp add github --command npx menambahkan MCP server dari command line.
  t072: thor mcp-serve menjalankan Thor sendiri sebagai MCP server untuk agent lain.
  t073: thor auth add memungkinkanmu menambahkan beberapa API key untuk rotasi kredensial.
  t074: thor completion bash >> ~/.bashrc mengaktifkan tab completion untuk semua command dan profil.
  t075: thor logs -f mengikuti agent.log secara real time. --level WARNING --since 1h memfilter outputnya.
  t076: thor backup membuat backup zip dari seluruh direktori home Thor-mu.
  t077: thor profile create coder membuat profil terisolasi yang menjadi command tersendiri.
  t078: thor profile create work --clone menyalin config dan key-mu saat ini ke profil baru.
  t079: thor update menyinkronkan skill bawaan baru ke SEMUA profil secara otomatis.
  t080: thor gateway install mengatur Thor sebagai layanan sistem (systemd/launchd).
  t081: thor memory setup memungkinkanmu mengonfigurasi provider memory eksternal (Honcho, Mem0, dll.).
  t082: thor webhook subscribe membuat rute webhook berbasis event dengan validasi HMAC.
  t083: "Hemat biaya: thor tools menonaktifkan tool yang tidak dipakai, thor skills config memangkas skill."
  t084: /reasoning low atau /reasoning minimal menurunkan kedalaman berpikir di bawah default (medium) — respons lebih cepat dan murah.
  t085: thor models mengarahkan tugas vision, compression, dan aux ke model yang lebih murah — memangkas biaya token background 85%+ tanpa menurunkan model chat utamamu.
  t086: "Set display.bell_on_complete: true di config.yaml untuk mendengar bel saat tugas panjang selesai."
  t087: "Set display.streaming: true untuk melihat token muncul secara real time saat model menghasilkan."
  t088: "Set display.show_reasoning: true untuk menyaksikan rantai pemikiran model."
  t089: "Set display.compact: true untuk mengurangi spasi di output agar informasinya lebih padat."
  t090: "Set display.busy_input_mode: queue untuk mengantrekan pesan daripada menghentikan agent, atau steer untuk menyuntikkannya di tengah run lewat /steer."
  t091: "Set display.resume_display: minimal untuk melewati rekap percakapan penuh saat melanjutkan sesi."
  t092: "Set compression.threshold: 0.50 untuk mengatur kapan kompresi otomatis menyala (default: 50% konteks)."
  t093: "Set agent.max_turns: 1000 agar agent bisa mengambil lebih banyak langkah tool call per turn."
  t094: "Set file_read_max_chars: 200000 untuk menaikkan konten maksimum per panggilan read_file."
  t095: "Set approvals.mode: smart agar sebuah LLM menyetujui otomatis perintah yang aman dan menolak otomatis yang berbahaya."
  t096: Set fallback_model di config.yaml untuk otomatis beralih ke provider cadangan.
  t097: "Set privacy.redact_pii: true untuk men-hash user ID dan nomor telepon sebelum dikirim ke LLM."
  t098: "Set browser.headed: true untuk melihat jendela Chromium lokal saat agent menjelajah."
  t099: "Set worktree: true di config.yaml untuk selalu membuat git worktree (sama seperti thor -w)."
  t100: "Set security.website_blocklist.enabled: true untuk memblokir domain tertentu dari tool web."
  t101: "Set cron.wrap_response: false untuk mengirim output agent mentah tanpa header/footer cron."
  t102: THOR_TIMEZONE menimpa zona waktu server dengan string zona waktu IANA apa pun.
  t103: "Substitusi environment variable bekerja di config.yaml: pakai sintaks ${VAR_NAME}."
  t104: Quick command di config.yaml menjalankan perintah shell seketika dengan nol pemakaian token.
  t105: Personality kustom bisa didefinisikan di config.yaml di bawah agent.personalities.
  t106: provider_routing mengatur pengurutan, whitelist, dan blacklist provider OpenRouter.
  t107: execute_code menjalankan skrip Python yang memanggil tool Thor secara programatik — hasilnya tidak masuk konteks.
  t108: delegate_task menjalankan sampai 10 subagent bersamaan secara default (delegation.max_concurrent_children) dengan konteks terisolasi untuk kerja paralel.
  t109: web_extract bekerja pada URL PDF — berikan link PDF apa pun dan dia mengubahnya ke markdown.
  t110: search_files ditenagai ripgrep dan lebih cepat dari grep — pakai itu daripada grep di terminal.
  t111: patch memakai 9 strategi pencocokan fuzzy sehingga perbedaan spasi kecil tidak merusak edit.
  t112: patch mendukung format V4A untuk edit massal banyak file dalam satu panggilan.
  t113: read_file menyarankan nama file yang mirip saat file tidak ditemukan.
  t114: read_file otomatis men-dedup — membaca ulang file yang tidak berubah mengembalikan stub ringan.
  t115: Set browser.user_data_dir ke sebuah folder untuk menyimpan satu profil Chromium persisten, agar login situs bertahan antar sesi.
  t116: browser.chromium_args menambahkan flag Chromium ekstra ke sesi browser lokal, misalnya --lang=de.
  t117: image_generate membuat gambar dengan FLUX 2 Pro dan upscaling 2x otomatis.
  t118: text_to_speech mengubah teks menjadi audio — diputar sebagai voice bubble di Telegram.
  t119: send_message bisa menjangkau platform messaging mana pun yang tersambung dari dalam sesi.
  t120: Tool todo membantu agent melacak tugas bertahap yang kompleks selama sesi.
  t121: session_search melakukan pencarian full-text di SEMUA percakapan lampau.
  t122: Agent otomatis menyimpan preferensi, koreksi, dan fakta lingkungan ke memory.
  t123: /moa mengarahkan satu prompt sulit lewat set model Mixture of Agents yang kamu konfigurasi.
  t124: Perintah terminal mendukung mode background dengan notify_on_complete untuk tugas berjalan lama.
  t125: Proses background terminal mendukung watch_patterns untuk memberi peringatan pada baris output tertentu.
  t126: "Tool terminal mendukung 6 backend: local, Docker, SSH, Modal, Daytona, dan Singularity."
  t127: Setiap profil punya config, API key, memory, sesi, skill, dan job cron sendiri.
  t128: Nama profil menjadi command shell — 'thor profile create coder' membuat command 'coder'.
  t129: thor profile export coder -o backup.tar.gz membuat arsip profil yang portabel.
  t130: Kalau dua profil tidak sengaja berbagi bot token yang sama, gateway kedua diblokir dengan error yang jelas.
  t131: Sesi otomatis membuat judul deskriptif setelah pertukaran pertama — tidak perlu menamai manual.
  t132: "Judul sesi mendukung garis keturunan: \"proyek saya\" → \"proyek saya #2\" → \"proyek saya #3\"."
  t133: Saat keluar, Thor menampilkan command resume beserta session ID dan statistiknya.
  t134: thor sessions export backup.jsonl mengekspor semua sesi untuk backup atau analisis.
  t135: thor -r SESSION_ID melanjutkan sesi lampau tertentu berdasarkan ID-nya.
  t136: Memory adalah snapshot yang dibekukan — perubahannya baru muncul di system prompt saat sesi berikutnya dimulai.
  t137: Entri memory otomatis dipindai untuk pola prompt injection dan eksfiltrasi.
  t138: "Agent punya dua penyimpanan memory: catatan pribadi (~2200 karakter) dan profil user (~1375 karakter)."
  t139: Koreksi yang kamu berikan ke agent ("bukan, lakukan begini") sering otomatis disimpan ke memory.
  t140: Lebih dari 80 skill bawaan mencakup github, creative, mlops, productivity, research, dan lainnya.
  t141: Setiap skill yang terpasang otomatis menjadi slash command — ketik / untuk melihat semuanya.
  t142: thor skills install official/security/1password memasang skill opsional dari repo.
  t143: Skill bisa dibatasi ke platform OS tertentu — sebagian hanya dimuat di macOS atau Linux.
  t144: skills.external_dirs di config.yaml memungkinkanmu memuat skill dari direktori kustom.
  t145: Agent bisa membuat skill-nya sendiri sebagai memory prosedural memakai skill_manage.
  t146: /plan menulis rencana implementasi markdown ke .thor/plans/ tanpa menjalankan apa pun.
  t147: "Job cron bisa melampirkan skill: thor cron add --skill blogwatcher \"Periksa post baru\"."
  t148: Target pengiriman cron mencakup telegram, discord, slack, email, sms, dan 12+ platform lainnya.
  t149: Kalau respons cron dimulai dengan [SILENT], pengirimannya ditahan — berguna untuk job yang hanya memantau.
  t150: Cron mendukung jeda relatif (30m), interval (setiap 2h), ekspresi cron, dan timestamp ISO.
  t151: Job cron berjalan di sesi agent yang benar-benar baru — prompt-nya harus mandiri.
  t152: Mode suara bekerja tanpa API key sama sekali kalau faster-whisper terpasang (speech-to-text lokal gratis).
  t153: "Lima provider TTS tersedia: Edge TTS (gratis), ElevenLabs, OpenAI, NeuTTS (lokal gratis), MiniMax."
  t154: /voice on mengaktifkan mode suara di CLI. Ctrl+B menyalakan rekaman push-to-talk.
  t155: TTS streaming memutar kalimat saat dihasilkan — kamu tidak menunggu respons penuh.
  t156: Pesan suara di Telegram, Discord, WhatsApp, dan Slack otomatis ditranskrip.
  t157: "Thor berjalan di 21 platform messaging: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, email, dan lainnya."
  t158: thor gateway install mengaturnya sebagai layanan sistem yang menyala saat boot.
  t159: DingTalk memakai Stream Mode — tidak perlu webhook atau URL publik.
  t160: BlueBubbles membawa iMessage ke Thor lewat server macOS lokal.
  t161: Rute webhook mendukung validasi HMAC, pembatasan rate, dan pemfilteran event.
  t162: API server membuka endpoint yang kompatibel dengan OpenAI, cocok dengan Open WebUI dan LibreChat.
  t163: "Mode channel suara Discord: bot ikut ke VC, mentranskrip ucapan, dan membalas dengan suara."
  t164: "group_sessions_per_user: true memberi setiap orang sesinya sendiri di chat grup."
  t165: /sethome menandai sebuah chat sebagai home channel untuk pengiriman job cron.
  t166: Gateway mendukung timeout berbasis ketidakaktifan — agent yang aktif bisa berjalan tanpa batas.
  t167: "Persetujuan perintah berbahaya punya 4 tingkat: once, session, always (allowlist permanen), deny."
  t168: Mode persetujuan pintar memakai LLM untuk menyetujui otomatis perintah aman dan menandai yang berbahaya.
  t169: Proteksi SSRF memblokir jaringan privat, loopback, link-local, dan alamat metadata cloud.
  t170: Session ID diawali timestamp (20250305_091523_abcd) sehingga pengurutan bekerja alami di ls dan jq.
  t171: Subproses MCP menerima lingkungan yang difilter — hanya variabel sistem yang aman yang lewat.
  t172: Context file (.thor.md, AGENTS.md) dipindai keamanannya terhadap prompt injection sebelum dimuat.
  t173: command_allowlist di config.yaml menyetujui permanen pola perintah shell tertentu.
  t174: Konteks otomatis dipadatkan saat mencapai ambangnya — memory dibersihkan dan riwayat diringkas.
  t175: Status bar berubah kuning, lalu oranye, lalu merah saat konteksnya terisi.
  t176: SOUL.md adalah file identitas utama agent — sesuaikan isinya untuk membentuk perilakunya.
  t177: Thor memuat konteks proyek dari .thor.md, AGENTS.md, CLAUDE.md, atau .cursorrules (yang pertama cocok).
  t178: AGENTS.md di subdirektori ditemukan secara bertahap saat agent masuk ke folder-folder.
  t179: Context file dibatasi 20.000 karakter dengan pemotongan head/tail yang cerdas.
  t180: "Backend browser: Chromium lokal, Lightpanda, Browserbase, Browser Use dan Firecrawl — plus Camofox sebagai plugin."
  t181: "Camofox (Firefox anti-deteksi) sekarang berupa plugin: thor plugins install camofox."
  t182: browser_exec menjalankan beberapa langkah browser dalam satu panggilan Python — navigasi, ekstraksi, dan klik sekaligus.
  t183: "browser.dialog_policy mengatur cara dialog halaman native ditangani: must_respond (agent menjawab dengan browser_dialog), auto_dismiss, atau auto_accept."
  t184: thor mcp membuka pemilih interaktif MCP yang disetujui Thor dan bisa dipasang dengan satu ketukan.
  t185: thor mcp catalog mendaftar MCP server yang disetujui Thor dan disertakan di repo.
  t186: thor mcp install <nama> memasang entri katalog, meminta kredensial, dan membiarkanmu memilih tool mana yang diaktifkan.
  t187: MCP server dikonfigurasi di config.yaml — transport stdio dan HTTP keduanya didukung.
  t188: "Pemfilteran tool per-server: tools.include sebagai whitelist dan tools.exclude sebagai blacklist tool tertentu."
  t189: MCP server otomatis membuat toolset saat runtime — thor tools bisa menyalakannya per platform.
  t190: "Dukungan OAuth MCP: auth: oauth mengaktifkan otorisasi berbasis browser dengan PKCE."
  t191: Checkpoint tidak punya overhead saat tidak ada file yang diubah — aktif secara default.
  t192: Snapshot sebelum rollback disimpan otomatis sehingga kamu bisa membatalkan pembatalannya.
  t193: /rollback juga membatalkan turn percakapannya, jadi agent tidak mengingat perubahan yang sudah di-rollback.
  t194: Checkpoint memakai shadow repo di ~/.thor/checkpoints/ — .git proyekmu tidak pernah disentuh.
  t195: batch_runner.py memproses ratusan prompt secara paralel untuk pembuatan data training.
  t196: thor chat -Q mengaktifkan mode senyap untuk pemakaian programatik — menahan banner dan spinner.
  t197: Penyimpanan trajectory (--save-trajectories) menangkap jejak tool-use lengkap untuk training model.
  t198: "Tiga jenis plugin: umum (tool/hook), provider memory, dan context engine."
  t199: thor plugins install owner/repo memasang plugin langsung dari GitHub.
  t200: "Provider memory eksternal: Honcho, Hindsight, Mem0, OpenViking dan lainnya lewat thor plugins install."
  t201: Hook plugin mencakup pre/post_tool_call, pre/post_llm_call, dan transform_terminal_output untuk menormalkan output.
  t202: Prompt caching (Anthropic) menurunkan biaya dengan memakai ulang prefix system prompt yang di-cache.
  t203: Agent otomatis membuat judul sesi di thread latar belakang — tanpa dampak latensi.
  t204: Routing model pintar bisa mengarahkan otomatis kueri sederhana ke model yang lebih murah.
  t205: "Slash command mendukung pencocokan prefix: /h menjadi /help, /mod menjadi /model."
  t206: Menyeret path file ke terminal otomatis melampirkan gambar atau mengirimnya sebagai konteks.
  t207: .worktreeinclude di root repo-mu mendaftar file yang di-gitignore untuk disalin ke worktree.
  t208: thor acp menjalankan Thor sebagai ACP server untuk integrasi VS Code, Zed, dan JetBrains.
  t209: "Provider kustom: simpan endpoint bernama di config.yaml di bawah custom_providers."
  t210: THOR_EPHEMERAL_SYSTEM_PROMPT menyuntikkan system prompt yang tidak pernah disimpan ke riwayat.
  t211: credential_pool_strategies mendukung rotasi fill_first, round_robin, least_used, dan random.
  t212: thor auth add thor atau thor auth add openai-codex mengatur provider berbasis OAuth.
  t213: API server mendukung Chat Completions dan Responses API dengan state di sisi server.
  t214: "tool_preview_length: 0 di config menampilkan path file lengkap di feed aktivitas spinner."
  t215: thor status --deep menjalankan pemeriksaan diagnostik yang lebih dalam di semua komponen.
  t216: Job cron bisa melampirkan skrip Python (--script) yang stdout-nya disuntikkan ke prompt sebagai konteks.
  t217: Skrip cron ada di ~/.thor/scripts/ dan berjalan sebelum agent — pas untuk pipeline pengumpulan data.
  t218: prefill_messages_file di config.yaml menyuntikkan contoh few-shot ke setiap panggilan API, tidak pernah disimpan ke riwayat.
  t219: SOUL.md sepenuhnya menggantikan identitas default agent — tulis ulang untuk membuat Thor jadi milikmu.
  t220: SOUL.md otomatis diisi personality default saat pertama dijalankan. Edit untuk menyesuaikannya.
  t221: /compress <topik fokus> mengalokasikan 60-70% anggaran ringkasan ke topikmu dan memangkas sisanya secara agresif.
  t222: Pada kompresi kedua dan seterusnya, kompresor memperbarui ringkasan sebelumnya alih-alih memulai dari nol.
  t223: Sebelum sesi gateway di-reset, Thor otomatis menyimpan fakta penting ke memory di latar belakang.
  t224: "network.force_ipv4: true di config.yaml memperbaiki hang di server dengan IPv6 rusak — menambal socket."
  t225: "Tool terminal memberi anotasi pada exit code umum: grep yang mengembalikan 1 = 'Tidak ada kecocokan (bukan error)'."
  t226: Perintah terminal foreground yang gagal otomatis dicoba ulang sampai 3 kali dengan backoff eksponensial (2s, 4s, 8s).
  t227: Perintah sudo polos otomatis ditulis ulang untuk menyalurkan SUDO_PASSWORD dari .env — tidak perlu prompt interaktif.
  t228: "Helper execute_code memerlukan import eksplisit: from thor_tools import json_parse, shell_quote, retry."
  t229: 7 tool sandbox execute_code (web_search, terminal, read/write/search/patch) memakai RPC — tidak pernah masuk konteks.
  t230: Membaca region file yang sama 3+ kali memicu peringatan. Di 4+, itu diblokir keras untuk mencegah loop.
  t231: write_file dan patch mendeteksi kalau file diubah dari luar sejak pembacaan terakhir dan memberi peringatan kebasian.
  t232: Format patch V4A mendukung direktif Add File, Delete File, dan Move File — bukan hanya Update.
  t233: MCP server bisa meminta komplet LLM balik lewat sampling — agent menjadi tool bagi server itu.
  t234: MCP server mengirim notifications/tools/list_changed untuk memicu pendaftaran ulang tool otomatis tanpa restart.
  t235: "delegate_task dengan acp_command: 'claude' menjalankan Claude Code sebagai child agent dari platform mana pun."
  t236: Delegasi punya thread heartbeat — aktivitas anak menjalar ke induknya, mencegah timeout gateway.
  t237: Saat provider mengembalikan HTTP 402 (payment required), klien auxiliary otomatis beralih ke berikutnya.
  t238: agent.tool_use_enforcement mengarahkan model yang hanya mendeskripsikan tindakan alih-alih memanggil tool — otomatis untuk GPT/Codex.
  t239: agent.restart_after_turn_timeout membiarkan turn yang sedang berjalan selesai sebelum /restart masuk ke stop(); restart_drain_timeout hanya anggaran interupsi paksa setelah stop() dimulai.
  t240: agent.api_max_retries (default 3) mengatur berapa kali agent mencoba ulang panggilan API yang gagal sebelum memunculkan error — turunkan untuk fallback cepat.
  t241: Gateway men-cache instance AIAgent per sesi — menghancurkan cache ini merusak prompt caching Anthropic.
  t242: Situs mana pun bisa membuka skill lewat /.well-known/skills/index.json — skills hub menemukannya otomatis.
  t243: Log audit skill di ~/.thor/skills/.hub/audit.log melacak setiap operasi pemasangan dan penghapusan.
  t244: "Git worktree yang basi otomatis dibersihkan: yang sudah merged dan bersih dihapus; yang kotor atau belum di-push diarsipkan dulu dan bisa dipulihkan dengan thor worktree restore."
  t245: Profil membatasi state Thor lewat THOR_HOME; subproses tool host tetap memakai HOME aslimu kecuali terminal.home_mode adalah profile.
  t246: Env var THOR_HOME_MODE (oktal, mis. 0701) mengatur izin direktori kustom untuk traversal web server.
  t247: "Mode container: letakkan .container-mode di THOR_HOME dan CLI host otomatis exec ke dalam container."
  t248: "Ctrl+C punya 5 tingkat prioritas: batalkan rekaman → batalkan prompt → batalkan picker → hentikan agent → keluar."
  t249: Setiap interupsi saat agent berjalan dicatat ke ~/.thor/interrupt_debug.log beserta timestamp-nya.
  t250: BROWSER_CDP_URL menyambungkan tool browser ke browser keluarga Chromium mana pun yang berjalan — menerima WebSocket, HTTP, atau host:port.
  t251: BROWSERBASE_ADVANCED_STEALTH=true mengaktifkan anti-deteksi lanjutan dengan Chromium kustom (Scale Plan).
  t252: CLI otomatis beralih ke mode ringkas di terminal yang lebih sempit dari 80 kolom.
  t253: "Quick command mendukung dua tipe: exec (menjalankan perintah shell langsung) dan alias (mengalihkan ke command lain)."
  t254: "Model delegasi per-tugas: delegation.model dan delegation.provider di config mengarahkan subagent ke model yang lebih murah."
  t255: delegation.reasoning_effort mengatur kedalaman berpikir subagent secara independen.
  t256: "display.platforms di config.yaml memungkinkan override tampilan per platform: {telegram: {tool_progress: all}}."
  t257: human_delay.mode di config mensimulasikan kecepatan mengetik manusia — rentang min_ms/max_ms bisa diatur.
  t258: Migrasi versi config berjalan otomatis saat dimuat — key config baru muncul tanpa intervensi manual.
  t259: Model GPT dan Codex mendapat panduan system prompt khusus untuk disiplin tool dan pemakaian tool yang wajib.
  t260: Model Gemini mendapat direktif yang disesuaikan untuk path absolut, tool call paralel, dan perintah non-interaktif.
  t261: context.engine di config.yaml bisa diatur ke nama plugin untuk strategi pengelolaan konteks alternatif.
  t262: Dengan browser cloud, URL localhost dan LAN dibuka di Chromium lokal (browser.auto_local_for_private_urls, aktif secara default).
  t263: "Kompresor melakukan pra-pass murah: output tool di atas 200 karakter diganti placeholder sebelum LLM berjalan."
  t264: Saat kompresi gagal, percobaan berikutnya dijeda 10 menit untuk menghindari menghantam API.
  t265: Perintah berbahaya yang panjang (>70 karakter) mendapat opsi 'view' di prompt persetujuan untuk melihat teks lengkapnya dulu.
  t266: Visualisasi level audio menampilkan bar ▁▂▃▄▅▆▇ saat merekam suara, berdasarkan level RMS mikrofon.
  t267: Nama profil tidak boleh bentrok dengan binary yang sudah ada di PATH — 'thor profile create ls' akan ditolak.
  t268: thor profile create backup --clone-all menyalin semuanya (config, key, SOUL.md, memory, skill, sesi).
  t269: Tombol rekam suara bisa diatur lewat voice.record_key di config.yaml — bukan hanya Ctrl+B.
  t270: File .cursorrules dan .cursor/rules/*.mdc dideteksi dan dimuat otomatis sebagai konteks proyek.
  t271: Context file mendukung 10+ pola prompt injection — Unicode tak terlihat, 'abaikan instruksi', upaya eksfiltrasi.
  t272: GPT-5 dan Codex memakai role 'developer' alih-alih 'system' di format pesannya.
  t273: "Override auxiliary per-tugas: auxiliary.vision.provider, auxiliary.compression.model, dll. di config.yaml."
  t274: Klien auxiliary memperlakukan 'main' sebagai alias provider — resolves ke provider + model utama milikmu yang sebenarnya.
  t275: thor import-agent openclaw --dry-run menampilkan pratinjau migrasi OpenClaw tanpa menulis apa pun.
  t276: Path file yang ditempel dengan tanda kutip atau spasi ter-escape ditangani otomatis — tidak perlu dibersihkan manual.
  t277: Slash command tidak pernah memicu pelipatan paste besar — /command dengan argumen panjang tetap bekerja benar.
  t278: Di mode interrupt, slash command yang diketik saat agent berjalan melewati logika interrupt dan langsung dijalankan.
  t279: THOR_DEV=1 melewati deteksi mode container untuk pengembangan lokal.
  t280: Setiap MCP server punya toolset sendiri (mcp-servername) yang bisa dinyalakan terpisah lewat thor tools.
  t281: Placeholder MCP ${ENV_VAR} di config diresolusi saat server dijalankan — termasuk variabel dari ~/.thor/.env.
  t282: Skill dari repo tepercaya (dwisetyabudi15581) mendapat level keamanan 'trusted'; skill komunitas mendapat pemindaian ekstra.
  t283: Karantina skill di ~/.thor/skills/.hub/quarantine/ menahan skill yang menunggu peninjauan keamanan.
  t284: /steer <prompt> menyuntikkan catatan setelah tool call berikutnya — mengarahkan di tengah tugas tanpa menghentikannya.
  t285: /goal <teks> mengatur objektif Ralph-loop permanen — Thor otomatis melanjutkan turn demi turn sampai juri menyatakan selesai.
  t286: /snapshot create [label] menyimpan snapshot penuh state config Thor; /snapshot restore <id> mengembalikannya nanti.
  t287: /copy [N] menyalin respons assistant terakhir ke clipboard-mu, atau yang ke-N dari belakang dengan sebuah angka.
  t288: /redraw memaksa repaint UI penuh, memperbaiki pergeseran terminal setelah resize tmux atau artefak seleksi mouse.
  t289: /agents (alias /tasks) menampilkan agent aktif dan tugas background yang berjalan di sesi saat ini.
  t290: /footer menyalakan footer gateway di balasan akhir yang menampilkan model, persentase konteks, dan cwd.
  t291: /busy queue|steer|interrupt mengatur apa yang terjadi saat menekan Enter selagi Thor bekerja.
  t292: /topic di DM Telegram mengaktifkan mode topik multi-sesi yang dikelola user — /topic <id> memulihkan sesi lampau langsung di sana.
  t293: /approve session|always menjalankan perintah berbahaya yang pending dengan cakupan kepercayaan pilihanmu; /deny menolaknya.
  t294: /restart me-restart gateway dengan rapi setelah menguras run yang aktif, lalu memberi ping ke pemintanya saat sudah kembali.
  t295: /kanban boards switch <slug> mengganti board Kanban multi-proyek yang aktif dari dalam chat.
  t296: /reload memuat ulang ~/.thor/.env ke sesi yang berjalan — mengambil API key baru tanpa restart.
  t297: cronjob dengan no_agent=True menjalankan skrip sesuai jadwal dan mengirim stdout-nya langsung — nol token, nol LLM.
  t298: Stdout skrip cron yang kosong berarti tick senyap — tidak ada yang dikirim, pas untuk watchdog ambang batas.
  t299: THOR_CRON_MAX_PARALLEL (default 4) membatasi berapa banyak job cron yang berjalan per tick agar ledakannya tidak menjenuhkan key-mu.
  t300: Hook gateway ada di ~/.thor/hooks/<nama>/ dengan HOOK.yaml + handler.py — handler-nya harus bernama `handle`.
  t301: Event hook mencakup gateway:startup, session:start, agent:step, dan langganan wildcard command:*.
  t302: Letakkan checklist ~/.thor/BOOT.md dan hook gateway:startup akan menjalankannya sebagai agent sekali jalan setiap boot.
  t303: thor curator run --dry-run menampilkan pratinjau apa yang akan diarsipkan atau digabungkan curator tanpa mengubah apa pun.
  t304: thor curator pin <skill> memagari skill secara keras dari pengarsipan otomatis dan dari tool skill_manage milik agent.
  t305: thor curator rollback memulihkan skill dari snapshot sebelum run — backup-nya ada di skills/.curator_backups/.
  t306: thor auth reset <provider> [target] membersihkan cooldown dan flag kelelahan pada seluruh credential pool, atau pada satu kredensial berdasarkan indeks, id, atau label.
  t307: "credential_pool_strategies.<provider>: round_robin memutar key secara merata alih-alih default fill_first."
  t308: "use_gateway: true per-tool mengarahkan web, image, tts, atau browser lewat langganan Thor-mu — tanpa key tambahan."
  t309: "provider_routing.data_collection: deny mengecualikan provider yang menyimpan data di OpenRouter."
  t310: "provider_routing.require_parameters: true hanya mengarahkan ke provider yang mendukung setiap param di request-mu."
  t311: THOR_TUI_RESUME=1 otomatis menyambung kembali ke sesi TUI terakhir saat diluncurkan — berguna setelah SSH terputus.
  t312: THOR_TUI_THEME=light|dark|<hex> memaksa tema TUI di terminal yang tidak mengeset COLORFGBG.
  t313: Ctrl+G atau Ctrl+X Ctrl+E di TUI membuka buffer input di $EDITOR untuk prompt multi-baris yang panjang.
  t314: TUI merender LaTeX secara inline — $E=mc^2$ menjadi matematika Unicode alih-alih TeX mentah.
  t315: thor dashboard meluncurkan UI web lokal di 127.0.0.1:9119 — tidak ada data yang keluar dari localhost.
  t316: thor dashboard menanamkan TUI Thor lengkap di browser-mu lewat xterm.js dan PTY WebSocket.
  t317: Letakkan YAML di ~/.thor/dashboard-themes/ dengan dua warna palet untuk mengubah tampilan seluruh dashboard.
  t318: "Plugin dashboard bisa langsung dipasang: manifest.json + bundle JS di ~/.thor/dashboard-plugins/ — tanpa build npm."
  t319: "layoutVariant: cockpit di tema dashboard menambahkan rail kiri 260px yang bisa diisi plugin lewat slot sidebar."
  t320: "display.tool_progress_command: true membuka /verbose di platform messaging; secara default hanya untuk CLI."
  t321: THOR_BACKGROUND_NOTIFICATIONS=result hanya memberi ping saat tugas background selesai (bandingkan dengan concise/all/error/off).
  t322: "THOR_WRITE_SAFE_ROOT membatasi write_file/patch ke prefiks direktori tertentu; beberapa path dipisah os.pathsep (: atau ;)."
  t323: THOR_IGNORE_RULES melewati injeksi otomatis AGENTS.md, SOUL.md, .cursorrules, memory, dan skill yang dimuat awal.
  t324: THOR_ACCEPT_HOOKS menyetujui otomatis hook shell yang belum pernah dilihat dan dideklarasikan di config.yaml tanpa prompt TTY.
  t325: auxiliary.goal_judge.model mengarahkan juri /goal ke model yang murah dan cepat agar biaya loopnya mendekati nol.
  t326: Checkpoint melewati direktori dengan lebih dari 50.000 file untuk menghindari operasi git yang lambat di monorepo raksasa.
  t327: "tts.provider: piper menjalankan TTS lokal 44 bahasa di CPU — suaranya otomatis diunduh ke ~/.thor/cache/piper-voices/."
  t328: "tts.providers.<nama>.type: command menyambungkan mesin TTS CLI apa pun dengan placeholder {input_path} dan {output_path}."
  t329: API_SERVER_ENABLED=true menjalankan endpoint yang kompatibel dengan OpenAI berdampingan dengan gateway untuk Open WebUI dan LibreChat.
  t330: "GATEWAY_PROXY_URL menjalankan setup terpisah: I/O platform secara lokal, kerja agent didelegasikan ke API server jarak jauh."
  t331: MATRIX_DEVICE_ID mematok device ID yang stabil untuk E2EE — tanpa itu, key berotasi setiap start dan dekripsi riwayat rusak.
  t332: TELEGRAM_WEBHOOK_SECRET wajib diisi setiap kali TELEGRAM_WEBHOOK_URL diset — buat dengan openssl rand -hex 32.
  t333: batch_runner.py --resume mencocokkan prompt yang sudah selesai berdasarkan teksnya sehingga penyusunan ulang dataset tidak menjalankan ulang pekerjaan yang sudah beres.
  t334: /new memulai sesi baru di tempat (alias /reset) — session ID baru, riwayat bersih, CLI tetap terbuka.
  t335: /clear membersihkan layar terminal DAN memulai sesi baru — satu pintasan untuk reset visual.
  t336: /history mencetak percakapan saat ini secara inline tanpa keluar dari CLI — berguna untuk membaca ulang cepat.
  t337: /save menulis percakapan saat ini ke disk tanpa mengakhiri sesinya.
  t338: "/status menampilkan info sesi secara sekilas: ID, judul, model, pemakaian token, dan waktu berjalan."
  t339: /image <path> melampirkan file gambar lokal untuk prompt berikutnya tanpa menempel atau drag-and-drop.
  t340: /platforms menampilkan status koneksi gateway dan platform messaging langsung dari dalam chat.
  t341: /commands menampilkan daftar slash command + skill yang terpasang secara berhalaman — berguna di platform tanpa tab completion.
  t342: /toolsets mendaftar setiap toolset yang tersedia sehingga kamu tahu apa yang diterima -t/--toolsets.
  t343: /voice tts menyalakan mode khusus TTS — agent membalas dengan suara tapi kamu tetap mengetik promptmu.
  t344: /reload-skills memindai ulang ~/.thor/skills/ agar skill yang baru diletakkan muncul tanpa restart sesi.
  t345: /indicator kaomoji|emoji|unicode|ascii memilih gaya indikator sibuk TUI yang tampil saat agent berjalan.
  t346: /debug mengunggah paket dukungan (info sistem + log) dan mengembalikan link yang bisa dibagikan — bekerja di chat juga.
  t347: "thor -z \"<prompt>\" adalah one-shot paling murni: jawaban akhir hanya ke stdout, tidak ada yang lain — ideal untuk dipipe di skrip."
  t348: thor chat --pass-session-id menyuntikkan session ID ke system prompt sehingga agent bisa merujuk dirinya sendiri.
  t349: thor chat --image path/to/pic.png melampirkan gambar lokal ke satu kueri -q tanpa langkah unggah terpisah.
  t350: thor chat --ignore-user-config melewati config user yang aktif — laporan bug dan run CI yang bisa direproduksi.
  t351: thor chat --source tool menandai chat programatik agar tidak mengotori thor sessions list.
  t352: thor dump --show-keys menyertakan sidik jari API key yang sudah diredaksi untuk debugging dukungan yang lebih dalam.
  t353: thor sessions rename <ID> "judul baru" mengganti nama sesi lampau mana pun; thor sessions delete <ID> menghapusnya.
  t354: thor import memulihkan zip backup Thor lengkap; ekspor sesi JSON/JSONL diimpor dari halaman Sessions di dashboard.
  t355: thor fallback mengelola rantai fallback_model secara interaktif — tanpa mengedit config.yaml manual.
  t356: thor pairing merotasi token pairing DM — pengirim pesan pertama setelah rotasi mengklaim akses ke bot itu.
  t357: thor setup memandu pengguna baru melewati provider, key, dan pemasangan platform dalam satu alur interaktif.
  t358: thor status --deep menjalankan pemeriksaan kesehatan penuh di setiap komponen; thor status biasa adalah tampilan cepat.
  t359: THOR_AGENT_TIMEOUT=0 menonaktifkan pembunuhan karena tidak aktif di gateway untuk agent yang berjalan — pakai untuk riset panjang.
  t360: THOR_ENABLE_PROJECT_PLUGINS=1 memuat otomatis plugin lokal repo dari ./.thor/plugins/ — dijaga kepercayaan sejak desainnya.
  t361: THOR_DISABLE_FILE_STATE_GUARD=1 mematikan penjaga 'file berubah sejak kamu membacanya' pada patch dan write_file.
  t362: THOR_ALLOW_PRIVATE_URLS=true membuat tool web bisa mengakses localhost dan jaringan privat — mati secara default di mode gateway.
  t363: THOR_OPTIONAL_SKILLS=name1,name2 memasang otomatis skill katalog opsional tambahan saat pertama kali dijalankan per profil.
  t364: THOR_BUNDLED_SKILLS menunjuk ke pohon skill bawaan kustom — dipakai oleh paket Homebrew dan Nix.
  t365: THOR_DUMP_REQUEST_STDOUT=1 membuang setiap payload request API ke stdout alih-alih ke file log.
  t366: THOR_OAUTH_TRACE=1 mencatat upaya penukaran dan penyegaran token OAuth yang sudah diredaksi untuk debugging autentikasi provider.
  t367: THOR_STREAM_RETRIES (default 3) mengatur berapa kali mencoba menyambung ulang di tengah stream saat error jaringan sementara.
  t368: THOR_GATEWAY_BUSY_ACK_ENABLED=false membisukan pesan ack ⚡/⏳/⏩ saat user mengirim pesan ke agent yang sibuk.
  t369: THOR_AGENT_NOTIFY_INTERVAL (default 180s) mengatur seberapa sering gateway memberi ping progres pada turn panjang.
  t370: THOR_RESTART_DRAIN_TIMEOUT (default 900s) membatasi berapa lama /restart menunggu run yang sedang berjalan sebelum memaksa.
  t371: THOR_CHECKPOINT_TIMEOUT (default 30s) membatasi pembuatan checkpoint filesystem — naikkan di monorepo besar.
  t372: "image_gen.model di config.yaml memilih model FAL: flux-2/klein, gpt-image-2, nano-banana-pro, dan lainnya."
  t373: image_gen.provider mengarahkan pembuatan gambar lewat plugin (OpenAI Images, Codex, FAL) alih-alih default.
  t374: AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY mengarahkan analisis vision ke endpoint apa pun yang kompatibel dengan OpenAI.
  t375: API_SERVER_MODEL_NAME menyesuaikan nama model di /v1/models — penting untuk setup Open WebUI multi-profil.
  t376: Plugin dashboard disajikan dari /dashboard-plugins/<nama>/ — letakkan file ke ~/.thor/dashboard-plugins/.
  t377: Chat --source tool dikecualikan dari thor sessions list secara default — set --source secara eksplisit untuk melihatnya.
  placeholder:
    p01: Tanya apa saja, atau ketik / untuk command…
    p02: Ringkas isi folder ini
    p03: Buat draf balasan untuk email terakhir di inbox-ku
    p04: Rencanakan sebuah fitur, lalu bangun langkah demi langkah
    p05: Temukan dan perbaiki test yang gagal
    p06: Riset topik ini dan tuliskan ringkasannya untukku
    p07: Apa yang berubah di repo ini belakangan ini?
    p08: Ubah catatan ini menjadi daftar to-do
    p09: Jelaskan error ini dan cara memperbaikinya
    p10: Set pengingat atau jadwalkan tugas berulang
    p11: Ketik / untuk menelusuri command, atau Ctrl+P untuk palette
