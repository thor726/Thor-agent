name: Archive pinned PM inputs

on:
  push:
    branches: [main]
    paths:
      - 'pm/lock.json'
      - 'pm/artifact-mirror.json'
      - 'scripts/termux/runtime_libs.json'
      - 'scripts/ci/archive_inputs.py'
      - '.github/workflows/archive-inputs.yml'
  workflow_call:
    inputs:
      sha:
        description: 'The admitted commit whose pins are archived.'
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-inputs:
    name: Preserve every pinned HTTP input
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    environment: release-signing
    timeout-minutes: 60
    # gh release create/upload for the ci-archive draft needs write; a read
    # token cannot see or write draft archive releases (run #16 lesson).
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      THOR_ARCHIVE_RELEASE: ci-archive
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      # Runner Python is intentional: the toolchain's upstream may be gone.
      # The archive transport is GitHub Release assets via the `gh` CLI
      # (scripts.releases.gh_assets) on the job token, so there is no secret
      # to provision and no secret gate. Forks still skip: a fork push must
      # not create or upload a ci-archive release in the fork. `!= true`
      # (not `== false`) also runs when the flag is absent from a
      # workflow_call payload, so a caller can never silently skip.
      - name: Verify and archive every pinned input
        if: github.event.repository.fork != true
        run: python3 -m scripts.ci.archive_inputs
      - name: Report the skipped fork archive
        if: github.event.repository.fork == true
        run: echo "::notice::Fork repository; pinned inputs were not archived."
