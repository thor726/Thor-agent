name: Desktop unsigned preview

# Unsigned, standalone (bundled payload) desktop installers for early testing:
# Windows NSIS .exe + Linux AppImage, published as a GitHub pre-release with
# SHA256 checksums. Deliberately separate from desktop-bundled-release.yml —
# this lane never touches stable tags, feeds, or the release machinery, and
# builds carry a commit identity (side-by-side userData, no update feed).
#
# No code signing: Windows shows a SmartScreen warning ("More info" →
# "Run anyway"). Signed installers wait for Azure Trusted Signing / Apple
# Developer credentials (see the Fase C plan).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview version label (e.g. 0.23.6-preview.1). Used in artifact names, the pre-release tag desktop-preview-<version>, and the in-app display version.'
        required: true
        type: string
      publish:
        description: 'Create the GitHub pre-release with the installers attached. Off = workflow artifacts only.'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: desktop-unsigned-preview
  cancel-in-progress: false

jobs:
  build-win32-x64:
    name: unsigned win32-x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      THOR_BUILD_COMMIT: ${{ github.sha }}
      THOR_PAYLOAD_VERSION: ${{ inputs.version }}
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare locked Desktop build toolchain
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'

      - uses: ./.github/actions/retry
        with:
          command: just js-install

      - name: Build unsigned bundled NSIS installer
        working-directory: apps/desktop
        run: pnpm run dist:bundled:nsis

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: thor-desktop-win32-x64
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  build-linux-x64:
    name: unsigned linux-x64 (AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      THOR_BUILD_COMMIT: ${{ github.sha }}
      THOR_PAYLOAD_VERSION: ${{ inputs.version }}
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare locked Desktop build toolchain
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'

      - uses: ./.github/actions/retry
        with:
          command: just js-install

      - name: Build unsigned bundled AppImage
        working-directory: apps/desktop
        run: pnpm run dist:bundled:linux

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: thor-desktop-linux-x64
          path: apps/desktop/release/*.AppImage
          if-no-files-found: error

  publish:
    name: publish pre-release
    if: inputs.publish == true
    needs: [build-win32-x64, build-linux-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist

      - name: Name artifacts and compute checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          win=$(find dist/thor-desktop-win32-x64 -name '*.exe' | head -n1)
          linux=$(find dist/thor-desktop-linux-x64 -name '*.AppImage' | head -n1)
          test -n "$win" && test -n "$linux"
          cp "$win" "release-assets/ThorBundled-${VERSION}-win-x64.exe"
          cp "$linux" "release-assets/ThorBundled-${VERSION}-linux-x64.AppImage"
          (cd release-assets && sha256sum ThorBundled-* > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Thor Agent Desktop ${VERSION} — unsigned preview build (commit ${{ github.sha }}).

          Standalone installers with the Thor runtime bundled; no separate \`thor\` install needed. This is a test build with a side-by-side identity — it does not replace or update a stable install.

          ## Install

          **Windows (.exe)** — the installer is not code-signed yet, so SmartScreen will warn: click **More info** → **Run anyway**, then follow the wizard.

          **Linux (.AppImage)** — make it executable and run it:
          \`\`\`sh
          chmod +x ThorBundled-${VERSION}-linux-x64.AppImage
          ./ThorBundled-${VERSION}-linux-x64.AppImage
          \`\`\`

          ## Verify your download

          Compare the SHA-256 of the downloaded file with \`SHA256SUMS.txt\`:
          \`\`\`sh
          sha256sum ThorBundled-${VERSION}-linux-x64.AppImage
          \`\`\`
          On Windows: \`Get-FileHash .\\ThorBundled-${VERSION}-win-x64.exe\` in PowerShell.

          macOS is not included yet — without Apple signing it cannot be installed normally. Signed Windows/macOS builds come later.
          EOF
          gh release create "desktop-preview-${VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Thor Desktop ${VERSION} (unsigned preview)" \
            --notes-file release-notes.md \
            release-assets/ThorBundled-* release-assets/SHA256SUMS.txt
