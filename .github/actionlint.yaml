# actionlint knows only GitHub-hosted runner labels. An org admin names the
# larger runners. Each one therefore reads as "unknown runner label" and hides
# the real findings, unless this file declares it.
self-hosted-runner:
  labels:
    - ubuntu-latest
    - ubuntu-latest
    - ubuntu-latest
    - windows-latest
    - windows-latest
    - macos-latest
    - macos-latest
    - macos-latest
    - macos-latest
    - ubuntu-latest
    - ubuntu-latest
    - windows-latest
    # GitHub larger runners still used by matrices not yet migrated.
    - windows-latest-32-arm-core
