name: birta
title: Birta
repo: https://github.com/birtadev/plugins
sha: fd2485de51401db9dd9b25f0bc495bd36e9752c8
subdir: thor
description: "Publish and share websites, HTML pages, landing pages, portfolios, reports, docs and slide decks at a link, collect feedback on the page, and have the agent apply it. Disclosure — hosted-only: every tool call goes to birta.dev and acts on your Birta projects; publishing makes a version visible at the project address."
maintainer: birtadev
tier: community
category: tools
version: "1.0.0"
# Skills are named birta:<skill> from Thor 0.22.6; older releases hash the namespace.
requires_thor: ">=0.22.6"
docs_url: https://github.com/birtadev/plugins/tree/main/thor
image: https://raw.githubusercontent.com/birtadev/plugins/fd2485de51401db9dd9b25f0bc495bd36e9752c8/thor/assets/banner.png
platforms: [linux, macos, windows]
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
known_issues:
- "Sign-in needs one extra command after install, because a portable mcp.json cannot declare OAuth: thor mcp add birta --url https://birta.dev/mcp --auth oauth --connect-timeout 300"
