description: "Manage Google Ads, Meta Ads, LinkedIn Ads, Microsoft Ads and Reddit Ads in Thor Agent. Analyse performance, find wasted spend and build or optimise campaigns with your approval. Agent Plugins v1 package: 16 PPC skills, one per platform plus 11 for jobs like client briefs, audits, ad copy and routines. The skills were written and are used by a PPC expert with 12 years in the field and $100M+ in ad spend managed. Sign-in is Thor' own OAuth 2.1 through one thor mcp add command: no Node.js, npx or API keys. On a paid plan, add HubSpot and the agent judges lead quality and sends qualified leads back to Google, Microsoft, LinkedIn and Reddit as offline conversions. Disclosure — creates and edits real ad campaigns that spend real money through AdPlug's hosted server (api.adplug.app); the skills preview each change and wait for an explicit yes, but Thor itself does not prompt before AdPlug tools unless `trust: untrusted` is set on each AdPlug server in config.yaml."
