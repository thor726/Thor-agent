description: "Review GitHub pull requests in Thor Desktop — inbox of your open PRs across repos, diffs with inline threads, line comments and reviews, private-repo images, watched PRs, and one-click Send to Thor for any comment. Disclosure — shells out to your logged-in gh CLI (and `git remote get-url origin` in the open project); GitHub writes only on explicit click, reviews confirmed; \"Send to Thor\" and \"review in new chat\" submit the PR comment text (written by other GitHub users) to your chat as a prompt immediately; polls watched PRs every 60 s while Desktop is open; no stored credentials, no telemetry. Independent codebase, not derived from gitthor."
