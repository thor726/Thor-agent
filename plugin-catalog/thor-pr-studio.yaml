description: "Review GitHub pull requests in Thor Desktop: inbox of your open PRs across repos, diffs with inline threads, line comments and reviews, private-repo images, watched PRs, one-click Send to Thor for any comment, and batch review: tick several PRs and Thor reviews them in parallel chats, handing its findings back to the panel as draft comments you accept or dismiss. Disclosure — shells out to your logged-in gh CLI (and `git remote get-url origin` in the open project), passing it Thor's process environment; GitHub writes only on explicit click, reviews confirmed, and Approve needs a separate explicit confirmation (UI and API); registers one agent tool, pr_studio_submit_findings, which only writes review findings to the plugin's own data directory (validated input, no network, no GitHub access); \"Send to Thor\", \"Review in this chat\" and \"Review in new chats\" submit prompts containing PR titles, branch names and comment text (written by other GitHub users, flagged to the agent as untrusted) to your chat immediately, and each new chat (up to 5 per batch) spends tokens on the model you pick; polls watched PRs every 60 s and Thor findings every 4-5 s while Desktop is open; no stored credentials, no telemetry. Independent codebase, not derived from gitthor."
