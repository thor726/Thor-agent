description: >-
  Deterministic local guardrails for Thor and dev workflows. Three invocable
  tools—git-diff secret scanning, a destructive-command firewall, and a project
  health score—plus native Thor surfaces: additive credential-redaction
  patterns, a soloknuckle:hygiene skill, thor hygiene CLI, /hygiene, and a
  weekly hygiene-report blueprint. One rule set, same verdicts across
  CLI/hooks/MCP/Thor. No hooks, no middleware, no prompt rewriting, no
  telemetry.
