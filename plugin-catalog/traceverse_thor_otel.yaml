name: traceverse_thor_otel
repo: https://github.com/Mandark-droid/thor-otel-plugin
sha: "69b744cd27da2c82c5a058b9985aa1289b45ba73"
description: "Thor Agent OpenTelemetry traces and dashboard logs, with local-model cost estimates and optional in-process evaluation, GPU, energy, and CO2 metrics via genai-otel-instrument. Disclosure — Sends OpenTelemetry traces and log records for every turn, LLM call and tool call (session ids, models, token counts, costs, tool names, errors) to an OTLP endpoint, `http://localhost:4318` unless `THOR_OTEL_ENDPOINT` points elsewhere; prompt, response and tool argument/result text is included only when `THOR_OTEL_CAPTURE_CONTENT=true`; if `genai-otel-instrument` is installed it is activated in-process and instruments the LLM client libraries Thor uses."
maintainer: Mandark-droid
tier: community
category: general
requires_thor: ">=0.19"
docs_url: https://github.com/Mandark-droid/thor-otel-plugin/blob/main/README.md
