name: "backfill"
repo: "https://github.com/wth-amna/thor-backfill"
sha: "b99250c2e8fe400549291abaee2ff4f093562474"
description: "Switch memory providers without Thor forgetting you: replays your past Thor sessions into the memory provider you use now, with a dry run, resume, no double imports and a before/after recall check. Disclosure — reads state.db read-only and config.yaml; sends past user/assistant turns to the memory provider you configured (a cloud provider receives them over the network); writes only its own plugin state (imported session ids, 16-character turn hashes, recall-check results); the optional `thor backfill check` uses your Thor model through its own auxiliary slot. No network calls, credentials or telemetry of its own."
maintainer: "wth-amna"
tier: "community"
category: "memory"
requires_thor: ">=0.23.1"
version: "0.1.0"
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
