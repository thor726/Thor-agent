name: thormade
repo: https://github.com/Noshkoto/thormade
sha: 8a99f1be66b0423d1a2166d70285974c5d39c584
description: "Community bot shelf for Thor. Add bots from thormade.lol in one click (thor://open/thormade?add=<id>), share your own with /sharebot, and move your Grok Bot bots into Thor, one Thor bot each. Added bots are treated as untrusted: a package holding anything a share never includes is refused, its config is rebuilt from an allowlist (no hooks, approvals, terminal, plugins or model settings), schedules arrive paused, MCP servers arrive off, and every skill is scanned first. Each becomes its own profile on your model and login. Sharing and adding from the agent tool go through Thor' approval prompt. Shares never include .env, auth.json, keys, tokens, memories or chats, and a single secret hit aborts the upload. Disclosure — network calls only to https://thormade.lol, when you browse, add, share or unshare (no telemetry, no install counting). Creates profiles under ~/.thor/profiles. Keeps listing manage tokens in ~/.thor/thormade/shared.json (0600). Reads profile secret values through agent.secret_scope only to block a leaking share (compared in memory, never stored or sent). Grok Bot migration reads grok-bot-export*.json from Downloads, makes no network calls, uses the official agent-importers plugin, and installs it with `thor plugins install agent-importers` only after the user confirms."
maintainer: Noshkoto
tier: community
category: desktop
requires_thor: ">=0.22.1"
docs_url: https://thormade.lol/bots
version: "1.3.0"
title: thormade bots
platforms: []
capabilities:
  provides_tools:
    - thormade_bots
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
