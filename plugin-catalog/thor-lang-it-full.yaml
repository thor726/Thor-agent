description: >-
  Italian (Italiano) language pack for Thor Desktop covering nearly every Desktop string (firstRun, themePicker, connector accounts and the update-channel picker included; the few array/object leaves the pack format rejects fall back to English). Core, CLI and TUI keep the Italian catalogs already bundled with Thor. Generated from the hand-reviewed typed catalog maintained in gradia64/thor-agent (gradia-desktop-it branch); function-backed keys ship as positional {0} templates. Independent community translation, unrelated to thor-lang-it. Disclosure — text-only catalogs plus an __init__.py whose register() is a no-op (kept so Desktop "Install from Git" accepts the pack, #138118); registering the pack never changes display.language, the user opts in via config.
maintainer: gradia64
