description: "Keep secrets out of plaintext .env files: a local encrypted vault (FloorVault, AES-256-SIV) whose items Thor loads as environment variables at startup (mapped source \"thorvault\", hv: references), with a thor hvault CLI to manage items. The vault key lives in your OS key store (Keychain, Secret Service, DPAPI), a key file, a systemd-creds credential, or THOR_VAULT_KEY. Disclosure — reads an encrypted store under <THOR_HOME>/agent-vault (or secrets.thorvault.dir) at startup; thor hvault commands write to it and thor hvault setup (or the first thor hvault bind) creates it; thor hvault bind also writes the secrets.thorvault env mapping (an hv: reference, never the value) and enabled: true into the profile's config.yaml through Thor' own config writer (--print-only prints it instead); thor hvault bind and allow also keep a sealed binding record of each item's bound command lines in the per-user state directory (FLOOR_VAULT_STATE_DIR, else the platform's non-roaming state directory), outside the store; reads its own master key only from the variable named by token_env (default THOR_VAULT_KEY) in the environment Thor scopes to the profile being fetched, else from the custody set in secrets.thorvault.custody: os (default; macOS Keychain, Linux Secret Service or Windows DPAPI, service floor-vault, shared with other FloorVault apps on the same account), key_file (the file named by secrets.thorvault.key_file, which must not be writable by group or others), or systemd-creds (master.key.sdcred beside the store) — never from FLOOR_VAULT_KEY, VAULT_MASTER_KEY or FLOOR_VAULT_KEY_FILE, which it also protects from being overwritten; a configured custody that fails is reported, never replaced by another; a passphrase-protected store (floorvault 0.4) is not supported, because startup never prompts and never creates a key, a credential or a store (a locked or missing key is reported and Thor starts without those variables), and only thor hvault setup may unlock the key store or create the key; reads Thor' own command line (sys.argv and sys.orig_argv, no other process's) to compare with the command bindings stored on an item by floorvault secrets allow or thor hvault allow, and resolves a bound item only when Thor was started with one of them (thor hvault bind binds a new item to the command line Thor starts its local gateway with, built from this interpreter and the profile home; --no-bind skips it) (secrets.thorvault.require_binding, default off, also skips items with no binding); resolved values become environment variables of the Thor process and its children, like .env entries; installs floorvault>=0.2.8,<0.5 from PyPI (plus secretstorage on Linux, pyobjc-framework-Security on macOS); one subprocess, only with custody: systemd-creds: the system's own systemd-creds (decrypt --user at startup; encrypt and decrypt in thor hvault setup), found only in system directories, run as an argument list with no shell and a minimal environment, the key passed through a pipe; otherwise no subprocesses; no network calls, no self-update; protection is at rest, not against code already running as the same user."
