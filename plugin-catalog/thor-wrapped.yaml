version: "0.1.2"
description: "Your week with Thor as a 30-second video, delivered every Sunday: what your agent did, what it cost, and how much of your time went into upkeep versus Thor working for you. Built from Thor's own session records by code: no model calls, no tokens, secrets and home paths stripped. Disclosure — reads your Thor session history (read-only) to build the video, runs a pinned `npx hyperframes@0.8.217` renderer that downloads a headless Chrome on first use, and `thor wrapped schedule` adds a weekly cron job that delivers the video to your chosen chat with `thor send`."
title: Thor Wrapped
maintainer: devpras22
tier: community
category: general
requires_thor: '>=0.22.0'
docs_url: https://github.com/devpras22/thor-wrapped
platforms: []
capabilities:
  provides_tools:
  - wrapped_make
  provides_hooks:
