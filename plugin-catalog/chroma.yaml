title: Chroma
description: >-
  Browse, import and manage 94 Thor skins from a Desktop pane: filter by pack,
  colour family or gallery, import TweakCN, VS Code, Base16 and Windows Terminal
  themes, edit a skin's palette, and apply it to this profile or everywhere.
  Optionally mints real gateway skins so the CLI and every connected Desktop
  follow the change. Applies themes only by hand-off to Thor Desktop's own
  ThemeProvider: the plugin paints no CSS token, sets no native-chrome hook and
  writes no boot key. Disclosure — one outbound GET to https://tweakcn.com/r/themes/<name>.json,
  only when a preset is imported, with no credential, cookie or auth header,
  and the reply parsed as JSON and never evaluated; it accepts only https on
  tweakcn.com and refuses every other host and scheme. Writes the chosen skin
  through config.set('skin', …), skin YAML under the active profile's
  THOR_HOME/skins/ with a .chroma sidecar, and ten chroma-* keys through
  ctx.storage (chroma-* localStorage fallback). Never writes thor-desktop-*
  or thor-boot-* keys: those are read only as a one-shot seed, and the SDK-gap
  request is filed as NousResearch/thor-agent#156281. No agent
  tools, hooks, middleware or environment variables, no credentials, no shells
  or child processes started by the plugin (the repository also ships optional
  install helper scripts that a user may run deliberately), no background
  processes, no telemetry, no network calls beyond the import above, and no
  self-updater — updates arrive only through a catalog re-pin. Built with
  significant AI assistance; the maintainer is a hobby coder. Derived from
  thor-theme-picker by jdtimothy (MIT); the fork adds the importers, the skin
  backend and the management actions.
