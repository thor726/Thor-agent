name: vaultwarden-secret-source
repo: https://github.com/cdalvaro/thor-vaultwarden-secret-source
sha: 223d50e6aab681ee87906b1dc70aef362619478a
description: "Headless, read-only Vaultwarden secret source for unattended Thor deployments: bootstraps itself with a dedicated account's API key and master password (file:// secret files, env:NAME references or literal values), renews its own bw session, and loads hidden custom fields from an ordered list of item UUIDs into environment variables at startup. Disclosure — runs the official Bitwarden CLI (bw, never auto-installed) against the configured https:// Vaultwarden server whenever Thor loads secrets (each process start and some later re-reads such as cron runs: one bw sync plus one read per item; transient failures retried up to 3 times within timeout_seconds); keeps the bw login state, session and a lock file in a mode-0700 directory under the system temp dir (session file mode 0600), never in THOR_HOME, .env or logs, and by default that directory is shared by every Thor profile on the host; reads bootstrap credentials from the file:// paths, env:NAME variables or literal values you configure; registers the `vaultwarden` secret source, so it cannot be enabled together with the `vaultwarden` catalog entry."
maintainer: cdalvaro
tier: community
category: tools
requires_thor: ">=0.22.7"
docs_url: https://github.com/cdalvaro/thor-vaultwarden-secret-source#readme
version: "1.0.4"
readme: true
platforms: [linux, macos]
