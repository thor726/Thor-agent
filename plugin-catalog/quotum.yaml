name: quotum
repo: https://github.com/qvotvm/thor-quotum
sha: 7f0d7a726b3a14ec0d97a1b5a1f5581be6a70da2
description: "A quotum seat or prepaid PAYG project as a provider, with usage and dashboard records or balance and receipts. Seat 401/402 recovery hints, opt-in advisory preflight and shared meter caching. Disclosure — seat mode sends prompts and QUOTUM_SEAT_KEY to api.venice.ai; /usage, Desktop usage, 402 guidance, optional QUOTUM_PREFLIGHT and the dashboard Seals tab send only a 16-hex sha256 handle of the seat key to quotum.org and read the seat's public record and model catalog there; QUOTUM_X_SEARCH=1 drops Thor web_search from seat requests for Venice-side web and X search (billed per search); PAYG mode (QUOTUM_PAYG_KEY, takes precedence) sends prompts, replies and the project key to quotum.org/api/payg/v1, whose gateway processes them and bills a prepaid project balance, and the dashboard reads balance and receipt metadata from it; both modes replace Thor' HTTP client via create_client; seats are funded by the QUOTUM crypto token; keys are read only through Thor' profile secret scope; no telemetry, shell commands, background processes or stored credentials."
maintainer: quotumorg
tier: community
category: models
version: "0.3.1"
requires_thor: ">=0.21.5"
docs_url: https://github.com/qvotvm/thor-quotum#readme
known_issues:
  - Requires agent.secret_scope.get_secret. Hosts without that API can load the plugin, but provider actions refuse credentials and the dashboard asks for a Thor upgrade and restart.
  - Both modes supply a client through create_client and require plugins.isolation in_process (the default); host isolation is unsupported.
  - Thor credential pools or configured fallback chains may run before terminal provider hints. Older builds without the classification hook cannot guarantee a Thor-level stop.
  - QUOTUM_PREFLIGHT is advisory and seat-only. Missing metadata skips the warning; it never switches the model or blocks inference.
  - Set QUOTUM_SEAT_KEY or QUOTUM_PAYG_KEY; PAYG takes precedence. requires_env is empty because Thor has no either/or declaration. Restart Thor and its gateway after changing modes.
  - PAYG intake and model availability are controlled by the gateway. Per-request x402 intake remains closed; use prepaid project keys.
  - Thor' bundled Achievements page has no hook for outside achievements, so the seat's seals live in the plugin's own Seals tab.
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
