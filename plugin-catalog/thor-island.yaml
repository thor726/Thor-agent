name: thor-island
repo: https://github.com/hunterbohm/thor-island
sha: 2433366e6150ea6be637bd92fe17be7f44e3b97e
subdir: thor-plugin
description: "Thor Island: a Dynamic Island style voice window on macOS for talking to Thor. The island_call_back tool rings it when a job is done and says the result when you answer; `thor island status|build|setup` builds the app at the same pinned commit and points its talks at this Thor. Disclosure — the island_call_back tool runs the Thor Island app's command line on this Mac, or on another Mac through the ssh-style transport command you set, and passes the job result to it to be spoken aloud; `thor island build` (run by you) builds the app from a local checkout or, when there is none, clones the app's GitHub repository at the exact commit Thor installed this plugin from into ~/Library/Caches/dev.thor-island.app/source, then runs that repository's own build scripts (which download a pinned FluidAudio release and checksum-pinned speech models from huggingface.co); `--install` replaces /Applications/Thor Island.app and can turn on its open-at-login item."
maintainer: hunterbohm
tier: community
category: voice
requires_thor: ">=0.22"
version: "0.1.0"
docs_url: https://github.com/hunterbohm/thor-island
platforms: []
capabilities:
  provides_tools:
    - island_call_back
  provides_hooks: []
  provides_middleware: []
  requires_env: []
