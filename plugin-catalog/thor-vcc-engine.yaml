description: "Instant context compaction for Thor Agent: builds the compaction summary in milliseconds with no LLM call, keeping the exact commands, exit codes, errors and files, each linked back to its original message for recall via session_search. Disclosure — no network calls, shell commands or credentials; reads Thor's config.yaml through Thor's own loader; subclasses ContextCompressor and relies on its private methods and on private helpers and constants in Thor's agent.context_compressor, conversation_compression, auxiliary_client, agent_init and skill_commands modules and thor_cli.plugins.get_plugin_commands, falling back to the stock compressor if they are missing; with the opt-in only_local_models setting, compaction for a non-local chat model goes to Thor's stock LLM summary; the /vcc chat command, available to anyone allowed to chat with the agent, switches that for hosted models for the whole profile and stores the choice in <THOR_HOME>/vcc_state.json, the only file it writes."
