name: cardlake
repo: https://github.com/cardleforall/cardlake-thor
sha: c49c43b8251ae8620a8f24affb3368560b9cc99f
description: >-
  Cardlake keeps what you mean to get back to (reminders, articles and videos to learn from, links,
  work) in one daily feed. This plugin puts that feed in your Telegram chat with Thor: /cardlake
  feed and today show your cards with Done, Tomorrow, Next week and Undo buttons and a pinned Today
  checklist, a morning message sends what's due, and you can send Thor a link to save it. Free
  account at cardlake.app, or host your own. Disclosure — talks to Cardlake only through Thor'
  "cardlake" MCP connection (cardlake.app or a self-hosted copy); sends and pins card messages in
  your private Telegram chat, and adds /cardlake to the bot's command menu unless you set that menu up
  yourself, through the bot Thor already runs; /cardlake save sends your text (with passwords, keys
  and tokens removed in code) to your own Thor model; stores only the id of the pinned Today message
  in plugin state. No shell commands, credentials, background processes or telemetry; the morning
  job exists only if you create it from the blueprint, and it cannot change cards.
maintainer: cardleforall
tier: community
category: tools
requires_thor: ">=0.22.5"
docs_url: https://github.com/cardleforall/cardlake-thor
version: "0.7.9"
title: Cardlake
