known_issues:
  - Needs the Thor Studio engine v0.6.2 or newer installed separately (uv tool install --python 3.12 git+https://github.com/PabloTheThinker/thor-studio@v0.6.2). If the CLI is missing or older, each tool returns a missing_dependency error with that command.
