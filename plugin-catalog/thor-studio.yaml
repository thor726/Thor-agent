subdir: thor_plugin/thor-studio
title: Thor Studio
description: "Local video tools for any Thor Agent: long video or link in, captioned shorts out, plus timeline edits, Canva-style designs and photo tools, as 14 chat tools and a /studio chat slash. Whisper + FFmpeg on your machine. Never posts. Disclosure — every tool runs the separately installed thor-studio engine CLI (v0.6.2+, installed by its own command, not covered by this pin) as a subprocess with a timeout and a minimal environment (PATH, HOME, LANG, TMPDIR, PYTHONPATH, THOR_STUDIO_*); tool calls read only media/image files under your home folder, /mnt, /media, /srv or the Studio library and write only new files inside ~/.thor/clips (never overwrite); links must be public http(s), and yt-dlp runs with every connection and redirect hop checked against loopback, private, link-local, CGNAT and reserved addresses; thor_studio_desk starts a detached local desk on 127.0.0.1 (loopback only); the plugin ships a local `thor-studio mcp` server entry; the `/studio` chat command queues a Studio job into the current chat as a user message; optional local Ollama for clip titles; caption cues and the desk log go under <thor home>/plugin-data/thor-studio; caption lines are written by the calling agent; no credentials, no telemetry and no social publishing."
maintainer: PabloTheThinker
tier: community
category: tools
requires_thor: ">=0.19.0"
