known_issues:
  - "Native Linux authoring is unavailable; native Windows is not verified for this release."
  - "Requires standard Godot 4.6.2 and matching hash-verified export templates for exports."
  - "Windows authoring requires the Job Object runner opt-in; it has no OS network or write confinement."
  - "Windows cannot export macOS apps."
  - "No general jumping, vehicle dynamics, multiplayer or seamless open world."
  - "Image audits can fail on some style packs even when bots complete; agent-designed games may need iteration."
  - "Godot setup is a human-confirmed download from official hosts; the optional export templates are about 1.25 GB."
  - "macOS apps are ad-hoc signed, not notarized; Gatekeeper acceptance on other Macs is not established."
  - "Validation (thor plugins validate --install-deps) passes with one warning, a guarded thor_cli import used for older-version discovery, and an in-process isolation note for one proof tool."
