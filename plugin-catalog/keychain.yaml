name: keychain
title: macOS Keychain
repo: https://github.com/shoaibyazdani/thor-keychain
sha: "bde7866b2d56f7fc856ab73cdd08756211cfa58c"
version: "0.1.1"
description: "Keep Thor provider credentials in the macOS login keychain instead of plaintext .env. Registers a SecretSource (secrets.keychain), so startup resolution runs through Thor's own orchestrator, after ~/.thor/.env loads and before credentials are read — the same path the bundled Bitwarden and 1Password sources use. Bindings are explicit (secrets.keychain.env: ENV_VAR: keychain-account) or discovered from an index the plugin keeps inside the keychain, so `thor keychain put NAME` is the whole setup. Adds keychain_status (vault-backed vs still-plaintext inventory; names, lengths and outcomes only), keychain_migration_plan (report-only: lists candidates and returns the exact `thor keychain migrate ...` command; writes nothing) and keychain_audit (fetch/migrate trail), plus a `thor keychain put|ls|rm|test|migrate|status|audit` CLI. Migration is operator-only in that CLI: it stores each value, verifies it by readback, backs up .env (0600), then removes the variable through thor_cli.config.remove_env_value() — the `thor config unset` path, so core's .env lock and its refusals for package-managed installs and admin-managed keys still apply. Disclosure — reads and writes generic-password items in the user's login keychain through /usr/bin/security called by absolute path (service `thor` by default); no network calls and no third-party service, nothing leaves the machine; the index of stored names lives in a keychain item (`thor!index`) and the audit log in <thor home>/plugin-data/keychain/audit.jsonl; the only .env write is the operator-run `thor keychain migrate` described above; the agent-facing tools write nothing; a locked keychain or denied ACL is a warning, never a startup block; a stored value is passed on argv for the single `security add-generic-password` call (visible to same-user processes for that moment) while reads, the once-per-process hot path, never put a value on argv. macOS-only, no Python dependencies, no env vars."
maintainer: shoaibyazdani
tier: community
category: tools
requires_thor: ">=0.23.0"
platforms: [macos]
readme: true
capabilities:
  provides_tools:
    - keychain_status
    - keychain_migration_plan
    - keychain_audit
  provides_hooks: []
  provides_middleware: []
  requires_env: []
