name: eselsbruecke
title: Eselsbrücke
repo: https://github.com/studioluftbruecke/thor-eselsbruecke
sha: 9a67182b7d03595680c52340c5d105541458a839
description: "A helper toolbox for Thor with tools you switch on and off: a today pad, a pomodoro, a billable time log, a formatter, a colour picker and small tools, which your agent can call for exact answers. Disclosure — local files only, no credentials, no telemetry. The optional \"Alerts while Desktop is closed\" switch (off by default) writes `scripts/eselsbruecke_alerts.py` into your Thor profile and adds a no-model Thor job, `eselsbruecke-alerts`, that runs every minute and delivers due timer and reminder alerts to all of the profile's home channels."
maintainer: studioluftbruecke
tier: community
category: desktop
requires_thor: ">=0.23.0"
docs_url: https://github.com/studioluftbruecke/thor-eselsbruecke#readme
version: "0.2.0"
readme: true
platforms: [linux, macos]
known_issues:
  - "With Thor on a server, install the plugin on the Desktop computer too, on the same version: Desktop loads the Eselsbrücke page from its own computer."
capabilities:
  provides_tools:
    - eselsbruecke_toolbox
    - eselsbruecke_pad
    - eselsbruecke_timer
    - eselsbruecke_timelog
    - eselsbruecke_calc
    - eselsbruecke_format
    - eselsbruecke_convert
    - eselsbruecke_text
    - eselsbruecke_generate
  provides_hooks: []
  provides_middleware: []
  requires_env: []
